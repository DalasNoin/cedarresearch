<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEDAR — Team</title>
<meta name="description" content="The team behind Cedar.">
<style>
  :root {
    --bg: #ffffff;
    --ink: #1b211d;
    --accent: #2f5140;
    --faint: #6b746d;
    --hairline: rgba(27, 33, 29, 0.15);
    --card: rgba(27, 33, 29, 0.03);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a16;
      --ink: #e6eae6;
      --accent: #8fb3a0;
      --faint: #8b948c;
      --hairline: rgba(230, 234, 230, 0.18);
      --card: rgba(230, 234, 230, 0.04);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 24px 96px; }
  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 56px;
  }
  .wordmark {
    display: inline-block;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.42em;
    margin: 0 -0.42em 0 0;
    color: var(--ink);
    text-decoration: none;
  }
  .nav { font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; }
  .nav a {
    color: var(--faint);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 1px;
  }
  .nav a:hover, .nav a:focus-visible { color: var(--accent); border-bottom-color: var(--accent); }
  .nav a[aria-current="page"] { color: var(--ink); }
  .nav span + span::before { content: "  \00B7  "; color: var(--faint); }

  h1 { font-size: 28px; font-weight: 600; margin: 0 0 24px; letter-spacing: -0.01em; }
  .person {
    border: 1px solid var(--hairline);
    background: var(--card);
    border-radius: 6px;
    padding: 22px 26px;
  }
  .person h2 { font-size: 20px; font-weight: 600; margin: 0 0 2px; letter-spacing: -0.01em; }
  .role-title {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 12px;
  }
  .person p { font-size: 15px; margin: 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="wordmark" href="/">CEDAR</a>
    <p class="nav"><span><a href="/team.html" aria-current="page">Team</a></span><span><a href="/jobs.html">Jobs</a></span></p>
  </div>

  <h1>Team</h1>

  <section class="person">
    <h2>Simon Lermen</h2>
    <p class="role-title">Director</p>
    <p>Author of <a href="https://arxiv.org/abs/2602.16800">Large-Scale Online Deanonymization With LLMs</a>. Researcher at MATS, based in London.</p>
  </section>
</div>
</body>
</html>
