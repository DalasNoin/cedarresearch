<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEDAR</title>
<meta name="description" content="CEDAR — Communicating Evidence and Demonstrations of AI Risk.">
<style>
  :root {
    --bg: #ffffff;
    --ink: #1b211d;
    --accent: #2f5140;
    --faint: #6b746d;
    --hairline: rgba(27, 33, 29, 0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a16;
      --ink: #e6eae6;
      --accent: #8fb3a0;
      --faint: #8b948c;
      --hairline: rgba(230, 234, 230, 0.18);
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  main {
    text-align: center;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 48px;
  }
  .wordmark {
    font-size: 34px;
    font-weight: 500;
    letter-spacing: 0.42em;
    margin: 0 -0.42em 0 0;
  }
  .paper {
    font-size: 14px;
    color: var(--faint);
  }
  .paper a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 1px;
  }
  .paper a:hover, .paper a:focus-visible { border-bottom-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1 class="wordmark">CEDAR</h1>
  <p class="paper"><a href="https://arxiv.org/abs/2602.16800">Large-Scale Online Deanonymization With LLMs</a></p>
</main>
</body>
</html>
